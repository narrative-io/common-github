name: Backup to S3 (common)

on:
  workflow_call:
    # inputs:
    # Automatically passed by Github
    # secrets:
    #   GITHUB_TOKEN:
    #     required: true

env:
  # In the absence of explicit configuration, `sun.jnu.encoding` gets set to `ANSI_X3.4-1968` which eventually causes
  # `sbt assembly` to fail due to e.g. shapeless having special characters like `λ` in class names.
  # See https://app.shortcut.com/narrativeio/story/19136
  LC_ALL: en_US.UTF-8
  # `github.token` rather than `secrets.GITHUB_TOKEN`: the context form resolves in a
  # called workflow without the caller passing anything, so callers do not need
  # `secrets: inherit` (see secrets-inherit remediation in backup-daily.yml).
  GITHUB_TOKEN: ${{ github.token }}
  AWS_REGION: us-east-1

jobs:
  s3-backup:
    runs-on: self-hosted
    steps:
      # persist-credentials: false is load-bearing here, not just lint compliance: the
      # s3-backup step below mirrors the whole workspace (including .git/) to S3, so a
      # persisted token would be written into .git/config in the backup bucket.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: 'arn:aws:iam::704349335716:role/nio-github-action-runner'
      - name: Get current date
        uses: josStorer/get-current-time@6826799222c9d913068c04cb99e67f34dbf3caae # v2.1.3
        id: get-current-date
        with:
          format: YYYY-MM-DD
          timezone: UTC
      # This step was peter-evans/s3-backup, a Docker action built FROM a 2022
      # minio/mc tag. Around 2026-09-12 Docker Hub stopped serving that tag to
      # anonymous pulls, so the self-hosted runner's image build started failing and
      # every backup since has died before this step ran at all. The AWS CLI is
      # already installed on these runners and already reads the credentials the
      # step above exports, so `aws s3 sync` does the same work with no image to
      # pull and no third-party action in the path.
      #
      # `--delete` is the old `--remove`. The old `--overwrite` has no counterpart:
      # sync replaces anything whose size or mtime differs, and the target prefix is
      # date-stamped, so each run writes into an empty prefix anyway.
      - name: S3 Backup (${{ steps.get-current-date.outputs.formattedTime }})
        env:
          # Interpolated into env rather than into the run block, which is what
          # zizmor's template-injection rule asks for.
          BACKUP_TARGET: s3://narrative-backups-prod/github/${{ github.event.repository.name }}/${{ steps.get-current-date.outputs.formattedTime }}
        run: |
          aws s3 sync . "$BACKUP_TARGET" --delete --no-progress
          # An object count in the log is what makes "this backup actually wrote
          # something" checkable from the run alone, with no AWS credential.
          aws s3 ls --recursive --summarize "$BACKUP_TARGET/" | tail -n 2
